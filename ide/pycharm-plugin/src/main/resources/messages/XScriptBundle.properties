check.address=Address format
check.fix.address=Use host:port, e.g. 192.168.1.20:9860 (9860 when omitted). Over USB run adb forward tcp:9860 tcp:9860 first and use 127.0.0.1:9860.
check.reach=Address reachable
check.fix.reach=Computer and phone must be on the same Wi-Fi; use the address and port shown on the phone''s home screen. Guest networks may isolate devices, and a VPN or proxy can block LAN addresses. For 127.0.0.1 run adb forward tcp:9860 tcp:9860 first (again after the emulator or adb restarts).
check.app=XScript app answers
check.fix.app=Open XScript on the phone; its home screen should show the developer address, not "service not started". A fresh install needs the notification permission first, and battery saving may have frozen it. Use the port shown there if it is not 9860.
check.xscript=It is XScript
