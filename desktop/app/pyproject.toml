[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xscript-desktop"
version = "0.6.1"
description = "XScript desktop Python device service (Electron + React frontend)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.1; python_version >= '3.11'",
  "sqlalchemy==2.0.54; python_version < '3.11'",
  "python-multipart==0.0.32",
  "websockets==17.1; python_version >= '3.11'",
  "websockets==16.1.1; python_version < '3.11'",
  "keyring>=25",
  "cryptography>=42",  # Ed25519 check of the signed update manifest (services/updater.py)
]

[project.optional-dependencies]
qt = ["PySide6>=6.8,!=6.12.0"] # legacy shell and its regression tests
electron-build = ["pyinstaller>=6"]
test = ["PySide6>=6.8,!=6.12.0", "pytest>=8", "pytest-qt>=4.4", "pytest-asyncio>=0.23", "pytest-cov>=5", "pytest-timeout>=2.3", "pytest-xdist>=3.6", "jsonschema>=4.20"]

[project.scripts]
xscript-service = "xscript_desktop.electron_host:main"
xscript-desktop-qt = "xscript_desktop.main:main"

[tool.setuptools]
packages = ["xscript_desktop", "xscript_desktop.services", "xscript_server", "xscript_server.routes"]

[tool.setuptools.package-dir]
xscript_server = "../../backend/xscript_server"

[tool.setuptools.package-data]
xscript_desktop = ["resources/**/*"]
xscript_server = ["api_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A hung test (typically QtWebEngine waiting on a page/JS callback) fails here instead of stalling CI to the
# 25-minute job limit. The slowest test takes ~7 s locally, so 120 s is a hang, not a slow runner.
# "thread": the timer runs in its own thread, so it fires even while the main thread is blocked inside Qt's C++
# event loop (the "signal" method only runs once Python bytecode does). It dumps every thread's stack, then
# ends the whole run (os._exit), so there is no coverage report for that run; a per-test override is
# @pytest.mark.timeout(N).
timeout = 120
timeout_method = "thread"
# No pytest-qt Qt-log capture. It installs a Python qInstallMessageHandler per test and swaps it back afterwards, but
# QtWebEngine logs from its own native threads (Chrome_InProcGpuThread) at any time, also between tests; a message that
# arrives while the handler is being swapped calls a freed Python callable and segfaults the worker (~5 % of fresh runs of
# test_close_guard on Linux, the "QtWebEngine segfault" flake). No test reads qtlog; Qt warnings still reach stderr.
addopts = "--no-qt-log"
required_plugins = ["pytest-timeout>=2.3"]
filterwarnings = [
  # CPython 3.10 asyncio: a finished child's transport can be collected after the test's loop closed (harmless, no leak of the process)
  "ignore:Exception ignored in.*BaseSubprocessTransport:pytest.PytestUnraisableExceptionWarning",
]
markers = [
  "perf: coarse performance budgets (generous limits; run with -m perf or in the default run)",
  "visual: screenshot regression against per-platform baselines in tests/baselines/ (skipped when none exists)",
  "device: needs a running Android emulator/device with the XScript app (skipped unless XSCRIPT_DEVICE_TESTS=1)",
  "qt: needs a Qt platform (runs offscreen)",
]

[tool.coverage.run]
source = ["xscript_desktop"]
branch = true
patch = ["subprocess"]  # --selftest / --screenshot tests run the app in a child process

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["pragma: no cover", "if __name__ == .__main__.:"]
