[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xscript-desktop"
version = "0.2.6"
description = "XScript desktop client (PySide6 shell + React frontend)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PySide6>=6.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4", "pytest-asyncio>=0.23"]

[project.scripts]
xscript-desktop = "xscript_desktop.main:main"

[tool.setuptools.packages.find]
include = ["xscript_desktop*"]

[tool.setuptools.package-data]
xscript_desktop = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "device: needs a running Android emulator/device with the XScript app (skipped unless XSCRIPT_DEVICE_TESTS=1)",
  "qt: needs a Qt platform (runs offscreen)",
]
