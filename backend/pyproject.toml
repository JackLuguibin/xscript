[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xscript-server"
version = "0.4.0"
license = {text = "MIT"}
description = "XScript 管理后台: 云控, 卡密授权, APK 打包 (FastAPI + React console)"
requires-python = ">=3.10"  # same floor as the device (Chaquopy 3.10) and the MCP server; 代码保护 needs a 3.10 interpreter (see protect.py)
# Pinned to the versions verified in this repo.
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    # websockets 17 and sqlalchemy 2.1 need Python 3.11; 3.10 gets the newest releases that support it.
    "websockets==17.1; python_version >= '3.11'",
    "websockets==16.1.1; python_version < '3.11'",
    "sqlalchemy==2.1.1; python_version >= '3.11'",
    "sqlalchemy==2.0.54; python_version < '3.11'",
    "cryptography==50.0.2",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "coverage>=7.6"]

[project.scripts]
xscript-server = "xscript_server.__main__:main"

[tool.setuptools.packages.find]
include = ["xscript_server*"]
