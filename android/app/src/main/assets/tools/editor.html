<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>脚本 IDE · XScript</title>
<script>(function(){var m=localStorage.getItem('xs-theme');document.documentElement.dataset.theme=m==='dark'||(m!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';})();</script>
<link rel="stylesheet" href="/tools/ui/tools.css"><link rel="stylesheet" href="/tools/ui/editor.css">
</head>
<body class="xs-shell">
<header class="xs-appbar" data-page="editor"></header>
<main class="ide">
 <aside class="ide-sidebar" id="files-drawer" aria-label="工程与文件">
  <div class="ide-heading"><strong>工程</strong><button id="new-project" type="button" title="新建工程">新建</button></div>
  <label class="sr-only" for="projects">选择工程</label><select id="projects"><option value="">选择工程…</option></select>
  <div class="ide-heading" id="files-heading"><strong>文件</strong><div><button id="open-search" type="button" aria-pressed="false" title="在工程内搜索和替换（Ctrl/Cmd+Shift+F）">搜索</button><button id="new-file" type="button" title="新建文件，可含子目录，如 lib/util.py">新建</button><button id="new-folder" type="button" title="新建文件夹">文件夹</button><button id="refresh" type="button" title="刷新文件列表">刷新</button></div></div>
  <nav id="files" role="tree" aria-label="工程文件"></nav>
  <section id="search-panel" class="search-panel" aria-label="工程内搜索和替换" hidden>
   <div class="ide-heading"><strong>搜索</strong><button id="search-close" type="button" title="返回文件（Esc）">返回文件</button></div>
   <div class="search-row"><input id="search-q" type="text" placeholder="搜索" aria-label="搜索内容" autocomplete="off" spellcheck="false"><span class="search-opts"><button id="s-case" type="button" aria-pressed="false" title="区分大小写">Aa</button><button id="s-word" type="button" aria-pressed="false" title="全字匹配">ab</button><button id="s-regex" type="button" aria-pressed="false" title="正则表达式">.*</button></span></div>
   <input id="search-r" type="text" placeholder="替换为（可留空）" aria-label="替换内容" autocomplete="off" spellcheck="false">
   <input id="search-inc" type="text" placeholder="文件：*.py, lib/**, !tests/**" aria-label="包含的文件" autocomplete="off" spellcheck="false">
   <div class="search-actions"><button id="search-go" type="button" class="primary">搜索</button><button id="replace-all" type="button" disabled title="替换全部结果（Shift+Enter 在替换框内）">全部替换</button><button id="replace-undo" type="button" disabled title="没有可撤销的替换">撤销替换</button></div>
   <div id="search-summary" class="search-summary" role="status" aria-live="polite"></div>
   <div id="search-results" class="search-results" aria-label="搜索结果"></div>
  </section>
  <section id="refs-panel" class="search-panel refs-panel" aria-label="查找引用" hidden>
   <div class="ide-heading"><strong id="refs-title">引用</strong><button id="refs-close" type="button" title="返回文件（Esc）">返回文件</button></div>
   <div id="refs-summary" class="search-summary" role="status" aria-live="polite"></div>
   <div id="refs-results" class="search-results" aria-label="引用列表"></div>
  </section>
  <div id="tree-menu" class="tree-menu" role="menu" hidden><button type="button" role="menuitem" data-act="rename">重命名… <kbd>F2</kbd></button><button type="button" role="menuitem" data-act="delete">删除</button></div>
  <div id="tab-menu" class="tree-menu" role="menu" hidden><button type="button" role="menuitem" data-act="one">关闭</button><button type="button" role="menuitem" data-act="others">关闭其他</button><button type="button" role="menuitem" data-act="right">关闭右侧</button><button type="button" role="menuitem" data-act="saved">关闭已保存</button><button type="button" role="menuitem" data-act="all">全部关闭</button></div>
  <div class="ide-sidebar-foot"><a href="/tools/ui/color.html">图色工具</a><a href="/tools/ui/mirror.html">查看手机</a></div>
 </aside>
 <section class="ide-workspace" aria-label="脚本工作区">
  <div class="ide-toolbar" role="toolbar" aria-label="编辑与运行">
   <button id="sidebar-toggle" type="button" aria-expanded="false" aria-controls="files-drawer" title="显示/隐藏工程与文件">☰ 文件</button>
   <button id="save" type="button" disabled><i data-i="save"></i> 保存 <kbd>⌘/Ctrl S</kbd></button>
   <button id="run" class="primary" type="button" disabled><i data-i="play"></i> 保存并运行 <kbd>F6</kbd></button>
   <button id="debug-run" type="button" disabled>保存并调试</button>
   <button id="stop" type="button" disabled>停止 <kbd>Shift F6</kbd></button>
   <span class="spacer"></span><a id="export" class="btn" hidden>导出 ZIP</a><button id="rename" type="button" title="重命名或移动选中的文件/文件夹（F2）" disabled>重命名</button><button id="shot-toggle" type="button" aria-pressed="false" title="截取手机屏幕，取坐标和颜色，保存到工程">截图</button><button id="delete-file" type="button" disabled>删除文件</button><button id="ui-mode" type="button" aria-pressed="true" title="在表单设计器和 JSON 文本之间切换" hidden>文本</button>
  </div>
  <div id="tabs" class="ide-tabs" role="tablist" aria-label="已打开文件"></div>
  <div class="ide-edit-area"><pre id="line-numbers" aria-hidden="true">1</pre><div class="ide-code"><pre id="highlight" aria-hidden="true"></pre><pre id="diag" aria-hidden="true"></pre><textarea id="editor" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-label="文件内容" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" disabled placeholder="选择工程和文件，或新建一个 Python 工程。入口为 __init__.py。"></textarea><ul id="complete" class="ide-complete" role="listbox" aria-label="补全建议" hidden></ul></div></div>
  <div id="ui-designer" class="ide-designer" aria-label="界面设计器" hidden></div>
  <section id="shot-panel" class="ide-shot" aria-label="手机截图" hidden>
   <div class="ide-heading"><strong>手机截图</strong><button id="shot-take" type="button">重新截图</button><button id="shot-save" type="button" disabled title="保存为当前工程 res/img/shot-时间.png">保存到工程</button><button id="shot-download" type="button" disabled>下载</button><button id="shot-insert" type="button" disabled title="在编辑器光标处插入 x, y">插入坐标</button><span id="shot-swatch" class="shot-swatch" hidden></span><span id="shot-info" class="shot-info" role="status" aria-live="polite"></span><span class="spacer"></span><button id="shot-close" type="button" aria-label="关闭截图面板">关闭</button></div>
   <div class="shot-body"><canvas id="shot-canvas" width="1" height="1" hidden aria-label="手机截图，点击取坐标和颜色"></canvas></div>
  </section>
  <div class="ide-status"><span class="ide-status-left"><span id="message" role="status" aria-live="polite">正在读取工程…</span></span><span class="ide-status-right"><button id="problems" type="button" class="problems" title="语法检查（本地，不执行代码）；点击跳到下一个问题" hidden></button><label class="auto-complete" title="Ctrl+空格 随时触发补全"><input type="checkbox" id="auto-complete" checked> 自动补全</label><span id="cursor">行 1，列 1</span></span></div>
  <section class="ide-debug" aria-label="断点调试">
   <div class="ide-heading"><strong>断点调试</strong><span id="debug-state" role="status">未连接</span><span class="spacer"></span>
   <button id="breakpoint" type="button" disabled>切换当前行断点</button>
   <button data-debug="continue" type="button" disabled>继续</button><button data-debug="next" type="button" disabled>单步</button><button data-debug="stepIn" type="button" disabled>进入</button><button data-debug="stepOut" type="button" disabled>跳出</button><button data-debug="pause" type="button" disabled>暂停</button>
   <button id="debug-disconnect" type="button" disabled>断开</button></div>
   <div class="ide-debug-detail"><div><span id="breakpoint-list">当前文件无断点</span><nav id="debug-stack" aria-label="调用栈"></nav></div><pre id="debug-variables" aria-label="变量"></pre></div>
  </section>
  <section class="ide-console" aria-label="运行日志"><div class="ide-heading"><strong>运行日志</strong><span id="run-state">等待设备</span><span class="spacer"></span><label><input type="checkbox" id="follow" checked> 跟随</label><button type="button" id="clear-logs">清空视图</button></div><pre id="logs" tabindex="0" aria-label="日志输出"></pre></section>
 </section>
</main>
<script src="/tools/ui/common.js"></script><script src="/tools/ui/editor-model.js"></script><script src="/tools/ui/editor-syntax.js"></script><script src="/tools/ui/editor-debug.js"></script><script src="/tools/ui/editor-api.js"></script><script src="/tools/ui/editor-docs.js"></script><script src="/tools/ui/editor-complete.js"></script><script src="/tools/ui/editor-parse.js"></script><script src="/tools/ui/editor-check.js"></script><script src="/tools/ui/editor-symbols.js"></script><script src="/tools/ui/editor-assist.js"></script><script src="/tools/ui/editor-search.js"></script><script src="/tools/ui/editor-panels.js"></script><script src="/tools/ui/ui-form.js"></script><script src="/tools/ui/ui-designer.js"></script><script src="/tools/ui/editor.js"></script>
</body></html>
