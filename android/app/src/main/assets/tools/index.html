</head>
<body>
<header class="top">
  <h1>XScript 开发工具</h1>
  <nav aria-label="工具">
    <a href="/tools/" aria-current="page">首页</a>
    <a href="/tools/ui/color.html">图色工具</a>
    <a href="/tools/ui/label.html">标注工具</a>
    <a href="/tools/ui/mirror.html">投屏</a>
  </nav>
</header>
<main class="cards">
  <a class="card" href="/tools/ui/color.html">
    <h2>图色工具</h2>
    <p>截图取色、生成多点找色 / 比色特征串，框选区域裁剪模板图到工程，并在同一帧上测试找色、比色、找图与 OCR。</p>
  </a>
  <a class="card" href="/tools/ui/label.html">
    <h2>标注工具</h2>
    <p>把截图加入数据集，框选目标并标注类别，导出 YOLO 训练集（images / labels / data.yaml）。</p>
  </a>
  <a class="card" href="/tools/ui/mirror.html">
    <h2>投屏</h2>
    <p>浏览器实时查看手机屏幕，点击画面即点击手机，拖动即滑动，支持返回 / 主页 / 最近任务。</p>
  </a>
</main>
<p style="padding:0 24px;color:#667085">设备接口没有鉴权，请只在可信网络中使用，或通过 USB + <code>adb forward</code> 访问。</p>
</body>
