# 生产部署：XScript 管理后台 + Caddy（自动申请 HTTPS 证书）。
#
#   cd deploy
#   cp .env.example .env    # 填域名和初始管理员密码
#   docker compose up -d
#
# 数据（数据库、卡密签名私钥、小程序、备份）都在 xscript-data 卷里，务必定期备份。
# 详见 docs/部署.md。

services:
  xscript:
    build:
      context: ..
      target: ${XSCRIPT_IMAGE_TARGET:-slim}
    image: xscript-server:${XSCRIPT_IMAGE_TARGET:-slim}
    restart: unless-stopped
    environment:
      XSCRIPT_ADMIN_USER: ${XSCRIPT_ADMIN_USER:-admin}
      XSCRIPT_ADMIN_PASSWORD: ${XSCRIPT_ADMIN_PASSWORD:?在 .env 里设置初始管理员密码}
      XSCRIPT_SESSION_HOURS: ${XSCRIPT_SESSION_HOURS:-12}
      # Empty = the SQLite file in the data volume. Set in .env to use PostgreSQL (docs/部署.md).
      XSCRIPT_DATABASE_URL: ${XSCRIPT_DATABASE_URL:-}
      # 只信任同一 compose 网络里的 Caddy 转发的客户端 IP
      XSCRIPT_FORWARDED_ALLOW_IPS: "*"
      # 正式签名（可选，full 镜像打包用）：把 jks 放进 ./secrets 后取消注释
      # XSCRIPT_KEYSTORE: /run/secrets/release.jks
      # XSCRIPT_KEY_ALIAS: key0
      # XSCRIPT_STORE_PASS: ${XSCRIPT_STORE_PASS}
      # XSCRIPT_KEY_PASS: ${XSCRIPT_KEY_PASS}
    volumes:
      - xscript-data:/data
      # - ./secrets/release.jks:/run/secrets/release.jks:ro
    # 不对外暴露端口，只经 Caddy 访问
    expose:
      - "8765"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - xscript
    environment:
      XSCRIPT_DOMAIN: ${XSCRIPT_DOMAIN:?在 .env 里设置域名}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  xscript-data:
  caddy-data:
  caddy-config:
