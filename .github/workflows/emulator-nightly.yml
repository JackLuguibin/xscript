# Device checks on a throwaway emulator: the 十分钟上手 sample + OCR smoke + landscape screen.size(), and the home
# screen's developer-address states incl. the USB-only dialog's copied command (scripts/ci_emulator_checks.sh). Nightly, on demand, and on pull requests that change these checks.
name: emulator nightly

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/emulator-nightly.yml
      - scripts/ci_emulator_checks.sh
      - scripts/device_endpoint_e2e.py
      - scripts/device_guide_smoke.py
      - scripts/device_pairing_copy_e2e.py
      - scripts/device_float_e2e.py
      - scripts/device_ui_try_e2e.py
      - desktop/frontend/src/ui-try.ts
      - android/app/src/main/assets/tools/ui-form.js

permissions:
  contents: read

concurrency:
  group: emulator-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: emulator checks (API 34 x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: wrapper
      - name: Debug APK (x86_64 only)
        run: bash android/build.sh :app:assembleDebug -Pxscript.abis=x86_64 --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator checks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ANDROID_SERIAL=emulator-5554 bash scripts/ci_emulator_checks.sh
