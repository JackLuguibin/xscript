# CI: mirrors scripts/verify.sh as far as a GitHub-hosted Ubuntu runner allows.
# NOT covered here (needs a device / emulator or the Mac toolchain): scripts/device_*_e2e.py, device_screen_smoke.py,
# emulator_grant_capture.sh, the VS Code host test against a real VS Code (scripts/vscode-host-test.sh), instrumented
# Android tests, 4 KB vs 16 KB page-size runs on emulators, and the .venv310 uv check (the matrix below runs 3.10 directly).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NO_PROXY: 127.0.0.1,localhost

jobs:
  # Pull requests skip the heavy Android / desktop jobs when no changed file can affect them (scripts/ci_changes.py
  # lists the areas). Pushes to main, release runs (workflow_call) and anything unexpected run everything.
  changes:
    name: changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.areas.outputs.android }}
      desktop: ${{ steps.areas.outputs.desktop }}
      postgres: ${{ steps.areas.outputs.postgres }}
      runtime: ${{ steps.areas.outputs.runtime }}
      python: ${{ steps.areas.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # a pull_request checkout is the test merge commit: parent 1 is the base branch
      - name: Self-test of the rules, the device scripts' pairing helper and the phone pins
        run: python3 -m unittest scripts/tests/test_ci_changes.py scripts/tests/test_devauth.py scripts/tests/test_phone_pins.py scripts/tests/test_device_scripts.py scripts/tests/test_versions.py scripts/tests/test_gen_api_catalog.py scripts/tests/test_python_syntax.py
      - id: areas
        name: Decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/ci_changes.py HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_changes.py --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  python:
    name: backend + MCP (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ide/mcp-server/pyproject.toml
      - name: Install backend and MCP server
        run: python -m pip install -e "backend[test]" -e "ide/mcp-server[test]"
      - name: Backend tests (3.12 with a coverage floor, see [tool.coverage] in backend/pyproject.toml)
        run: |
          if [ "${{ matrix.python }}" = "3.12" ]; then
            PYTHONPATH=backend python -m coverage run --rcfile=backend/pyproject.toml -m unittest discover -s backend/tests
            python -m coverage report --rcfile=backend/pyproject.toml
          else
            PYTHONPATH=backend python -m unittest discover -s backend/tests
          fi
      - name: MCP tests
        run: PYTHONPATH=ide/mcp-server python -m unittest discover -s ide/mcp-server/tests
      - name: Generated files are up to date (stubs, Web IDE completion and hover/signature indexes, node specs, API catalog)
        if: matrix.python == '3.12'
        run: |
          python scripts/gen_stubs.py --check
          python scripts/gen_completions.py --check
          python scripts/gen_editor_docs.py --check
          python scripts/gen_nodespecs.py --check
          python scripts/gen_api_catalog.py --check
      - name: Vertical slice against the mock device
        if: matrix.python == '3.12'
        run: PYTHONPATH=ide/mcp-server python scripts/vertical_slice.py --mock

  # The same backend suite on PostgreSQL (tests/pgtest.py gives every test its own database). Only when the
  # server's Python code may have changed; SQLite (the default) is covered by the job above on every run.
  postgres:
    name: backend on PostgreSQL 16
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xs
          POSTGRES_PASSWORD: xs-ci-only  # throwaway CI database, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xs" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[test,postgres]"
      - name: Backend tests on PostgreSQL
        env:
          XSCRIPT_TEST_DATABASE_URL: postgresql://xs:xs-ci-only@127.0.0.1:5432/postgres
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests

  # The phone's library versions (android/app/build.gradle.kts) wherever PyPI has a CPython 3.10 Linux wheel, so the
  # runtime tests exercise what ships; scripts/tests/test_phone_pins.py fails if the two lists drift.
  # opencv: the phone has 4.5.1.48 (wheels only up to cp39), CI uses 4.5.4.60, the nearest 4.5 release with one.
  runtime:
    name: on-device Python runtime tests (3.10, phone library versions)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml  # the pinned versions live in the install step below
      - name: Install the phone's library versions
        # phone-pins
        run: python -m pip install numpy==1.23.3 opencv-python-headless==4.5.4.60 pillow==11.0.0 pyyaml==6.0.3 requests==2.33.1 packaging==24.2 onnxruntime==1.22.1 coverage==7.10.7
      - name: Runtime tests with a coverage floor (see android/python-runtime/.coveragerc)
        # test_find_colors_fast is ~37 s of pure-Python pixel loops that the tracer slows ~4x; it runs untraced (the
        # coverage it would add is already there), keeping this job as fast as it was without coverage.
        run: |
          export PYTHONPATH=android/python-runtime:android/python-runtime/tests
          traced=$(cd android/python-runtime/tests && ls test_*.py | sed 's/\.py$//' | grep -vx test_find_colors_fast)
          python -m coverage run --rcfile=android/python-runtime/.coveragerc -m unittest $traced
          python -m unittest test_find_colors_fast
          python -m coverage report --rcfile=android/python-runtime/.coveragerc

  web-ide:
    name: Web IDE (node + headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Node tests (state, HTTP contract, browser UI)
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          echo "Chrome: $CHROME"
          node --test scripts/tests/*.test.cjs

  vscode-extension:
    name: VS Code extension (unit tests + vsix)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ide/vscode-extension/package-lock.json
      - name: Install, compile, test
        working-directory: ide/vscode-extension
        run: |
          npm ci
          npm run compile
          npm test
          node scripts/export-templates.js --check  # the PyCharm plugin's templates.json matches src/newProject.ts
      - name: Package the vsix
        working-directory: ide/vscode-extension
        run: |
          npm run package
          ls -l xscript-vscode-*.vsix

  console:
    name: backend web console (type-check + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/web/package-lock.json
      - working-directory: backend/web
        run: npm ci
      - name: Unit tests (vitest + Testing Library)
        working-directory: backend/web
        run: npm test
      - name: Type-check (app + tests) and build
        working-directory: backend/web
        run: npm run build

  # Two halves in parallel: the JVM tests + debug APK, and the R8 release APKs. Each restores the Gradle build cache
  # (setup-gradle; main writes it, PRs read it), so a warm half is ~1 min.
  android:
    name: Android (${{ matrix.title }})
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.android == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: tests
            title: Kotlin JVM tests + debug APK + 16 KB check
          - part: release
            title: R8 release APKs, universal + arm64-v8a, 16 KB check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Chaquopy needs a build-machine Python whose minor version matches the embedded one (3.10)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: SDK packages (compileSdk 37, build-tools for zipalign / aapt2 / apksigner)
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: wrapper
      - name: Kotlin unit tests (JVM) and the debug APK, one Gradle run
        if: matrix.part == 'tests'
        run: XSCRIPT_GRADLE_TASK=:app:testDebugUnitTest bash android/build.sh :app:assembleDebug --console=plain
      - name: APK is 16 KB ready (zipalign -P 16, ELF alignment, pageSizeCompat)
        if: matrix.part == 'tests'
        run: python scripts/check_16kb.py android/app/build/outputs/apk/debug/app-debug.apk
      # Release builds run R8; build one unsigned here so shrinking problems show up before a tag does.
      - name: Build the release APK (R8, unsigned)
        if: matrix.part == 'release'
        run: XSCRIPT_GRADLE_TASK=:app:assembleRelease bash android/build.sh --console=plain
      - name: Release APK is 16 KB ready
        if: matrix.part == 'release'
        run: python scripts/check_16kb.py android/app/build/outputs/apk/release/app-release-unsigned.apk
      # release.sh also ships a phone-only APK; it must carry arm64-v8a code and nothing for x86_64.
      - name: Build the arm64-v8a release APK and check its ABIs
        if: matrix.part == 'release'
        run: |
          XSCRIPT_GRADLE_TASK=:app:assembleRelease bash android/build.sh -Pxscript.abis=arm64-v8a --console=plain
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          python scripts/check_16kb.py "$apk"
          python - "$apk" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          libs = {n.split("/")[1] for n in names if n.startswith("lib/")}
          x86 = [n for n in names if "x86" in n]
          assert libs == {"arm64-v8a"}, libs
          assert not x86, x86[:5]
          assert any(n.startswith("assets/chaquopy/stdlib-arm64-v8a") for n in names)
          # native libraries ship compressed (useLegacyPackaging): the APK file is what users download
          stored = [i.filename for i in zipfile.ZipFile(sys.argv[1]).infolist() if i.filename.startswith("lib/") and i.compress_type != zipfile.ZIP_DEFLATED]
          assert not stored, stored[:5]
          print("arm64-v8a only:", len(names), "entries")
          PY

  desktop-frontend:
    name: desktop frontend (type-check, unit tests + coverage, build)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install, type-check, unit tests with coverage thresholds, production build
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:coverage
          npm run build

  # Split from the frontend job so the two run side by side. The Python tests load the built frontend in QtWebEngine,
  # so this job builds it again (npm ci + vite, ~10 s) instead of waiting for the other job's artifact.
  desktop-python:
    name: desktop client (Python tests incl. offscreen QtWebEngine)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: desktop/app/pyproject.toml
      - name: Build the frontend into the Python package
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build
      - name: Qt system libraries (QtWebEngine on a headless runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libnss3 libdbus-1-3 libfontconfig1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - name: Python tests + coverage, 4 workers (e2e, subprocess CLI, security, perf budgets; visual/device tests skip without baselines/devices)
        run: |
          python -m pip install -e "desktop/app[test]"
          cd desktop/app && python -m pytest -q -n 4 --cov --cov-report=term-missing --cov-fail-under=85
      - name: Test matrix in docs/桌面端-测试方案.md is generated from the tests (no drift)
        run: python desktop/app/tools/gen_test_matrix.py --check
      - name: Shell self-test (loads the built frontend, one QWebChannel round trip)
        run: cd desktop/app && python -m xscript_desktop --selftest

  # The same desktop client on Windows: Python tests (no coverage floor; that is enforced on Ubuntu), the frontend
  # build and the shell self-test. Path handling, subprocess and Qt differences show up here first.
  desktop-windows:
    name: desktop client on Windows (tests, frontend build, --selftest)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: desktop/app/pyproject.toml
      - name: Build the frontend into the Python package
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build
      - name: Python tests, 4 workers
        run: |
          python -m pip install -e "desktop/app[test]"
          cd desktop/app && python -m pytest -q -n 4
      - name: Shell self-test (loads the built frontend, one QWebChannel round trip)
        run: cd desktop/app && python -m xscript_desktop --selftest

  pycharm-plugin:
    name: PyCharm plugin (Kotlin tests, buildPlugin, verifyPlugin)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: wrapper
          build-root-directory: ide/pycharm-plugin
      - name: Tests, plugin zip and Plugin Verifier against PyCharm Community
        working-directory: ide/pycharm-plugin
        run: ./gradlew --console=plain test buildPlugin verifyPlugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xscript-pycharm-plugin
          path: ide/pycharm-plugin/build/distributions/*.zip
          if-no-files-found: error

  release-versions:
    name: release versions agree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/release.sh check

  # One check that stays meaningful whatever was skipped: it fails if any job failed or was cancelled.
  ci-ok:
    name: ci ok
    if: always()
    needs: [changes, python, postgres, runtime, web-ide, vscode-extension, pycharm-plugin, console, android, desktop-frontend, desktop-python, desktop-windows, release-versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
