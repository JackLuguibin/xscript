openapi: 3.0.3
info:
  title: XScript Device HTTP
  version: 0.2.0
  description: |
    Contract between the Android runtime and PC / MCP clients. Default port 9860 (kept clear of
    AScript's 9096); the app tries 9861..9869 if 9860 is taken.
    The cloud-control WebSocket relays the same requests through ApiRouter.

    SECURITY: there is no authentication. Anyone who can reach the port can upload and run
    code (/eval, /projects/{name}/run). Use only on trusted networks or via `adb forward`.
    The server sends no CORS headers, so browser pages cannot read responses.
servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "9860"
paths:
  /:
    get:
      summary: Landing page with the device status
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string
  /status:
    get:
      summary: Device and runtime status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /debug/status:
    get:
      summary: Current loopback DAP transport status (connected, port, error)
      responses:
        "200":
          description: Transport status JSON
  /debug/connect:
    post:
      summary: Connect the HTTP bridge to the explicitly started script debugger on loopback port 5678
      responses:
        "200":
          description: Connected; next cursor is 0
        "409":
          description: Debugger not ready or another transport already connected
  /debug/request:
    post:
      summary: Send one DAP JSON request (seq, type=request, command, arguments)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Frame sent; receive the DAP response through /debug/messages
        "409":
          description: Debugger disconnected
  /debug/messages:
    get:
      summary: Poll decoded DAP messages with monotonic cursor
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: messages [{id,message}], next, connected, error, dropped_before (oldest retained cursor)
  /debug:
    delete:
      summary: Disconnect DAP transport; does not stop the project process
      responses:
        "200":
          description: Disconnected
  /projects/{name}/debug:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      summary: Run a saved project with debugging enabled; wait up to 120 seconds for DAP configuration
      responses:
        "200":
          description: Started; debug.port and debug.remote_root identify listener and absolute source root
        "403":
          description: License refused the run
        "404":
          description: Missing project
        "409":
          description: A script is running or starting
  /screen:
    get:
      summary: Full-screen screenshot (PNG by default)
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [png, jpg, jpeg]
            default: png
        - name: quality
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 80
          description: JPEG quality
        - name: max
          in: query
          schema:
            type: integer
            minimum: 64
            maximum: 4096
          description: Scale down so the longest side is at most this many pixels (remote control frames)
      responses:
        "200":
          description: Image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "503":
          description: Capture unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ui-tree:
    get:
      summary: Accessibility (or root uiautomator) node tree
      parameters:
        - name: mode
          in: query
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: "0 = simple (text/desc/clickable/editable), 1 = full tree"
      responses:
        "200":
          description: Tree JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiTree"
        "503":
          description: No automation channel (accessibility off and no root)
  /action:
    post:
      summary: Direct automation for remote control panels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Action"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Unknown action type
  /settings:
    get:
      summary: Runtime settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      summary: Update runtime settings (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Bad value
  /projects:
    get:
      summary: List project names
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
  /projects/{name}:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      summary: Create an empty project with a template __init__.py
      description: >-
        The name must be an identifier (Unicode letters, digits, underscore; not starting
        with a digit). Never overwrites: an existing project is a 409.
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  project: { type: string }
        "400":
          description: Invalid project name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Project already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Delete a project (stops it first if running)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /projects/{name}/files:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    get:
      summary: List files in a project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        size: { type: integer }
                  dirs:
                    type: array
                    description: Every folder in the project (relative, "/"-separated), including empty ones
                    items: { type: string }
    put:
      summary: Upload one file, or a batch via {"files":[...]} (creates the project if needed)
      description: >-
        With "create": true on a single-file body the write is create-only: the project
        must exist (404) and the path must not exist yet (409). Missing parent folders
        are created. Paths with "..", ".", empty segments or a leading "/" are rejected (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/FileUpload"
                - type: object
                  required: [files]
                  properties:
                    files:
                      type: array
                      items:
                        $ref: "#/components/schemas/FileUpload"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Invalid path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Project missing (create mode only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Path already exists (create mode only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /projects/{name}/dir:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      summary: Create a folder (and missing parents) inside the project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, example: lib/sub }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  path: { type: string }
        "400":
          description: Invalid path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Missing project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Path already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /projects/{name}/move:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      summary: Rename or move a file or folder inside the project (single atomic rename, never replaces)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, example: lib/a.py }
                to: { type: string, example: pkg/a.py, description: Missing parent folders are created. }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  from: { type: string }
                  to: { type: string }
        "400":
          description: Invalid path, same path, the entry point, a folder into itself, or the target's parent is a file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Missing project or source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Target already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /projects/{name}/file:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
      - name: path
        in: query
        required: true
        schema:
          type: string
    get:
      summary: Read a file. Text files return utf-8, others base64. raw=1 returns bytes.
      parameters:
        - name: raw
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUpload"
        "404":
          description: Missing file
    delete:
      summary: Delete one file, or an empty folder
      description: The entry point (__init__.py / __init__.pyc) cannot be deleted.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Entry point or invalid path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: File not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Folder is not empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /projects/{name}/zip:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    put:
      summary: Import a zip (AScript exports supported; a single top folder is stripped)
      parameters:
        - name: replace
          in: query
          schema:
            type: string
            enum: ["true", "false"]
            default: "true"
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Imported
    get:
      summary: Export the project as a zip
      responses:
        "200":
          description: Zip bytes
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /projects/{name}/run:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      summary: Start the project in the :script process
      responses:
        "200":
          description: Started
        "404":
          description: Missing project or entry file
        "409":
          description: Already running
  /projects/{name}/stop:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      summary: Kill the script process (a user stop, so 停止后重新运行 does not trigger)
      responses:
        "200":
          description: Stopped
  /projects/{name}/config:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    get:
      summary: Run options (开机自启 / 停止后重新运行)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfig"
    put:
      summary: Change run options; omitted flags stay as they are
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_run: { type: boolean }
                stop_re_run: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfig"
        "404":
          description: Missing project
  /schedules:
    get:
      summary: 定时任务
      parameters:
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }
                  exact_alarms: { type: boolean }
    post:
      summary: Add a schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Schedule"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid schedule or missing project
  /schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: One schedule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: Missing schedule
    put:
      summary: Update fields of a schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Schedule"
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid
        "404":
          description: Missing schedule
    delete:
      summary: Remove a schedule
      responses:
        "200":
          description: "{ok: bool}"
  /schedules/{id}/run:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Run the schedule's project now
      responses:
        "200":
          description: "{result: started | skipped | queued | missing}"
        "404":
          description: Missing schedule
  /ascript/projects:
    get:
      summary: AScript projects found on the device (/sdcard/airscript/model)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
  /ascript/import:
    post:
      summary: Copy an AScript project into XScript (needs root or shared storage access)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Imported
  /logs:
    get:
      summary: Incremental runtime logs
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            default: 0
          description: Return entries with seq greater than this value
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Logs"
    delete:
      summary: Clear logs
      responses:
        "200":
          description: Cleared
  /models:
    get:
      summary: Model files (YOLO .onnx, PaddleOCR packs) in the shared model directory
      responses:
        "200":
          description: Directory and files
          content:
            application/json:
              schema:
                type: object
                properties:
                  dir: {type: string}
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        path: {type: string}
                        size: {type: integer}
                        modified: {type: integer}
  /models/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: Relative path inside the model directory (may contain "/")
        schema: {type: string}
    put:
      summary: Upload a model file (raw body, written through a temp file)
      requestBody:
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  path: {type: string}
                  size: {type: integer}
    get:
      summary: Download a model file
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {description: Missing}
    delete:
      summary: Remove a model file
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ok"}
  /packages:
    get:
      summary: Packages installed at runtime (not the ones bundled in the APK)
      responses:
        "200":
          description: Installed packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  packages:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        version: {type: string}
                        location: {type: string}
    post:
      summary: Install or uninstall PyPI packages on the device (runs in the eval process)
      description: |
        Pure-Python wheels come from PyPI (or index_url); packages with C extensions only from
        Chaquopy's Android index. Packages bundled in the APK are never replaced.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [packages]
              properties:
                op: {type: string, enum: [install, uninstall], default: install}
                packages: {type: array, items: {type: string}, example: ["schedule==1.2.2", "pymysql"]}
                upgrade: {type: boolean, default: false}
                index_url: {type: string}
                timeout_ms: {type: integer, default: 300000}
      responses:
        "200":
          description: Result with the install log
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  installed:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        version: {type: string}
                        native: {type: boolean}
                  skipped: {type: object, additionalProperties: {type: string}}
                  removed: {type: array, items: {type: string}}
                  log: {type: array, items: {type: string}}
        "400": {description: Resolution or download failed (error in body)}
        "408": {description: Timed out}
  /eval:
    post:
      summary: Short Python eval in the `:eval` process. Assign the answer to `_result`.
      description: |
        One snippet runs at a time. On timeout the `:eval` process is killed (and restarts on
        the next call), so module state from earlier snippets is lost. A crash in the snippet
        returns ok=false and does not affect the main process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalRequest"
      responses:
        "200":
          description: Finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalResponse"
        "408":
          description: Timeout
  /screen/stream:
    get:
      summary: 投屏 MJPEG stream (multipart/x-mixed-replace), at most 2 viewers
      parameters:
        - { name: fps, in: query, schema: { type: integer, minimum: 1, maximum: 15, default: 5 } }
        - { name: scale, in: query, schema: { type: number, minimum: 0.2, maximum: 1, default: 0.5 } }
        - { name: quality, in: query, schema: { type: integer, minimum: 10, maximum: 95, default: 50 } }
      responses:
        "200":
          description: |
            JPEG parts separated by `--xscriptframe`. Each part has `X-Screen-Size: WxH` with the
            full screen resolution, for mapping clicks back to screen pixels. Frame rate is best
            effort (root screencap ≈ 2 fps, MediaProjection much faster).
          content:
            multipart/x-mixed-replace:
              schema: { type: string, format: binary }
        "429":
          description: Too many concurrent streams
  /tools/:
    get:
      summary: Developer tools home (图色工具, 标注工具, 投屏). Pages live under /tools/ui/.
      responses:
        "200": { description: HTML }
  /website/src/screen.html:
    get:
      summary: AScript URL alias for 图色工具 (serves /tools/ui/color.html; `?plug=FindColors|CompareColors|FindImages|Ocr`)
      responses:
        "200": { description: HTML }
  /website/src/label.html:
    get:
      summary: AScript URL alias for 标注工具 (serves /tools/ui/label.html)
      responses:
        "200": { description: HTML }
  /tools/snapshots:
    get:
      summary: Recent snapshots, newest first (the device keeps the last 30)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots: { type: array, items: { $ref: "#/components/schemas/Snapshot" } }
    post:
      summary: Freeze the current screen as a PNG snapshot; with a PNG body, store that image instead
      requestBody:
        required: false
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { description: Body is not a PNG }
        "503": { description: Capture unavailable }
    delete:
      summary: Delete every cached snapshot
      responses:
        "200": { description: "{ok, deleted}" }
  /tools/snapshots/{id}:
    delete:
      summary: Delete one snapshot (a trailing .png is accepted)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ok}" }
  /tools/snapshots/{id}.png:
    get:
      summary: Snapshot image
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: PNG, content: { image/png: { schema: { type: string, format: binary } } } }
        "404": { description: Missing snapshot }
  /tools/snapshots/{id}/crop:
    post:
      summary: Save a snapshot region as a PNG template inside a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rect, project]
              properties:
                rect: { type: array, items: { type: integer }, minItems: 4, maxItems: 4 }
                project: { type: string }
                path: { type: string, default: "res/img/crop_<ms>.png", description: Must end with .png }
      responses:
        "200": { description: Saved }
        "404": { description: Missing snapshot }
  /tools/vision:
    post:
      summary: 图色 check on a snapshot, run in the :eval process with the script engine
      description: |
        ops: `pixel` (x, y, or points=[[x,y],...]), `find_colors` (colors, rect, sim, space, ori,
        max_num ≤ 100), `compare_colors` (colors, sim, count_sim → match, hits, need, per-point
        expected/actual), `find_image` (template "<project>:<path>", template_rect on this
        snapshot, or template_snapshot + template_rect for a region of another snapshot;
        confidence, rgb, maxcnt, ori, scale_range), `ocr` (rect, pattern, confidence, binary
        threshold 0-255). Responses include `ms`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot, op]
              properties:
                snapshot: { type: string }
                op: { type: string, enum: [pixel, find_colors, compare_colors, find_image, ocr, yolo] }
                engine: { type: string, enum: [mlkit, paddle, paddle_v4], default: mlkit, description: ocr engine }
                model: { type: string, example: "demo:res/best.onnx", description: "yolo model: <project>:<path> or a path in the model directory" }
                conf: { type: number, default: 0.25, description: yolo confidence threshold }
                iou: { type: number, default: 0.45, description: yolo NMS IoU }
                colors: { type: string, example: "634,2126,#05D395|675,2142,#05D395" }
                rect: { type: array, items: { type: integer } }
                sim: { type: number, default: 0.9 }
                template: { type: string, example: "demo:res/img/ok.png" }
                template_rect: { type: array, items: { type: integer } }
                template_snapshot: { type: string, description: Snapshot that template_rect is cut from }
                count_sim: { type: number, default: 1.0, description: compare_colors share of points that must match }
                ori: { type: integer, minimum: 1, maximum: 8, description: AScript search direction }
                pattern: { type: string, description: ocr regex filter }
                binary: { type: integer, minimum: 0, maximum: 255, description: ocr binarisation threshold }
                confidence: { type: number, default: 0.8 }
                timeout_ms: { type: integer, default: 12000, minimum: 500, maximum: 120000, description: "yolo / paddle default 60000 (model load)" }
      responses:
        "200": { description: Result (ok=true) }
        "400": { description: Bad request (ok=false, error) }
        "404": { description: Missing snapshot }
        "408": { description: "Timeout; the :eval process was restarted" }
  /tools/datasets:
    get:
      summary: 标注 datasets with image / labelled counts
      responses:
        "200": { description: OK }
  /tools/datasets/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, pattern: "^[\\p{L}\\p{N}_-]{1,64}$" } }
    get:
      summary: Classes, per-class box counts and items ({id, file, labeled, boxes})
      responses: { "200": { description: OK }, "404": { description: Missing dataset } }
    post:
      summary: Create a dataset
      responses: { "200": { description: Created } }
    delete:
      summary: Delete a dataset with its images and labels
      responses: { "200": { description: Deleted } }
  /tools/datasets/{name}/classes:
    put:
      summary: Replace the class list (rename or append; indices still used by labels cannot be dropped)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { classes: { type: array, items: { type: string } } } }
      responses: { "200": { description: Updated }, "400": { description: Invalid or in use } }
  /tools/datasets/{name}/classes/{index}:
    delete:
      summary: Drop a class and its boxes; later class indices shift down by one
      parameters:
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: Updated dataset }, "400": { description: Index out of range } }
  /tools/datasets/{name}/rename:
    post:
      summary: Rename the dataset
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [to], properties: { to: { type: string } } }
      responses: { "200": { description: Renamed dataset }, "400": { description: Invalid or taken name } }
  /tools/datasets/{name}/images:
    post:
      summary: 'Add an image. Body is PNG/JPEG bytes, or JSON {"snapshot": "<id>"}'
      responses: { "200": { description: "{ok, id}" }, "400": { description: Not an image } }
  /tools/datasets/{name}/images/{id}:
    get:
      summary: Image bytes
      responses: { "200": { description: PNG or JPEG } }
    delete:
      summary: Delete the image and its label
      responses: { "200": { description: Deleted } }
  /tools/datasets/{name}/labels/{id}:
    get:
      summary: Boxes for one image
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
    put:
      summary: Save boxes (clamped to the image, zero-area boxes dropped)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Label" }
      responses: { "200": { description: Saved label }, "400": { description: Bad class index } }
    delete:
      summary: Remove the label so the image is unlabelled again (an empty PUT marks a negative sample)
      responses: { "200": { description: "{ok}" } }
  /tools/datasets/{name}/export:
    get:
      summary: YOLO (Ultralytics) zip of labelled images
      description: |
        images/{train,val}/, labels/{train,val}/ with `cls cx cy w h` (normalised), data.yaml
        with nc and names. Every 5th labelled image goes to val; with a single image it is
        also copied to val. Unlabelled images are skipped; empty labels are kept as negatives.
      responses:
        "200": { description: Zip, content: { application/zip: { schema: { type: string, format: binary } } } }
        "400": { description: No classes or no labelled images }
components:
  parameters:
    ProjectName:
      name: name
      in: path
      required: true
      schema:
        type: string
  schemas:
    Status:
      type: object
      required: [name, sdk, width, height, port, accessibility, capture, running]
      properties:
        name: { type: string }
        model: { type: string }
        brand: { type: string }
        sdk: { type: integer }
        release: { type: string }
        width: { type: integer }
        height: { type: integer }
        density: { type: integer }
        ip: { type: string }
        port: { type: integer }
        accessibility: { type: boolean }
        root: { type: boolean }
        run_mode:
          type: string
          enum: [auto, accessibility, root]
        channel:
          type: string
          description: Channel currently used for gestures and node actions
        capture: { type: boolean }
        capture_source: { type: string }
        notification_listener:
          type: boolean
          description: 通知使用权 granted and connected (full notification events)
        exact_alarms:
          type: boolean
          description: Schedules use exact alarms (Android 12+ needs the 闹钟和提醒 grant)
        running: { type: boolean }
        project:
          type: string
          nullable: true
        version: { type: string }
        overlay:
          $ref: '#/components/schemas/Overlay'
    Overlay:
      type: object
      description: Floating window (悬浮窗) state of the app. Not mirrored by the mock device's geometry.
      properties:
        enabled: { type: boolean, description: "Setting float_on_run (运行时显示悬浮窗)" }
        always: { type: boolean, description: "Setting float_always (后台一直显示, also while idle)" }
        mode:
          type: string
          enum: [run, always, 'off']
        permitted: { type: boolean, description: "Overlay grant (悬浮窗权限 / SYSTEM_ALERT_WINDOW)" }
        visible: { type: boolean, description: "The window is attached right now" }
        expanded: { type: boolean, description: "The 运行/停止/日志/打开 panel is open" }
        app_foreground: { type: boolean, description: "One of the app's activities is on screen (the window hides then)" }
        side:
          type: string
          enum: [left, right]
          description: Edge the window docks to
        reason:
          type: string
          nullable: true
          enum: [no_permission, disabled, foreground, idle, script_hidden]
          description: Why it is hidden (null while visible)
        x: { type: integer, description: "Screen position in px (only while visible)" }
        y: { type: integer }
        width: { type: integer }
        height: { type: integer }
    ProjectConfig:
      type: object
      properties:
        project: { type: string }
        auto_run:
          type: boolean
          description: 开机自启. One boot project per device; enabling it here clears the previous one.
        stop_re_run:
          type: boolean
          description: 停止后重新运行. Re-run on exit or crash, not after a user stop. Pauses after 5 exits within 10 s.
        boot_project: { type: string }
    Schedule:
      type: object
      properties:
        id: { type: string, readOnly: true }
        project: { type: string }
        kind:
          type: string
          enum: [daily, interval, once]
        time:
          type: string
          description: daily, "HH:mm" device-local
        weekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: daily, 1 = Monday .. 7 = Sunday; empty = every day
        every:
          type: integer
          description: interval, minutes (1..10080), on a fixed grid from creation
        window:
          type: string
          description: interval, optional "HH:mm-HH:mm" (may cross midnight)
        at:
          description: once, epoch ms or "yyyy-MM-dd HH:mm" (device-local)
          oneOf:
            - { type: integer }
            - { type: string }
        if_running:
          type: string
          enum: [skip, restart]
          description: What to do when a script is already running
        wake: { type: boolean, description: "Turn the screen on before running" }
        enabled: { type: boolean }
        created: { type: integer, readOnly: true }
        last_run: { type: integer, readOnly: true }
        next:
          type: integer
          readOnly: true
          description: Next fire time (epoch ms), 0 when it will not fire
    Settings:
      type: object
      properties:
        run_mode:
          type: string
          enum: [auto, accessibility, root]
        float_on_run: { type: boolean }
        float_always:
          type: boolean
          description: Also show the floating window while no script runs (only in the background)
        keep_screen_on: { type: boolean }
        cloud_url:
          type: string
          readOnly: true
    Action:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [click, swipe, input, key, node]
        x: { type: integer }
        y: { type: integer }
        x1: { type: integer }
        y1: { type: integer }
        x2: { type: integer }
        y2: { type: integer }
        dur: { type: integer }
        text: { type: string }
        name:
          type: string
          description: "key: back, home, recents, notifications, quick_settings, lock_screen, screenshot, power_dialog"
        path:
          type: string
          description: "node: node path from /ui-tree"
        action:
          type: string
          default: click
        arg: { type: string }
    UiRect:
      type: object
      properties:
        l: { type: integer }
        t: { type: integer }
        r: { type: integer }
        b: { type: integer }
    UiNode:
      type: object
      properties:
        path: { type: string }
        id: { type: string }
        text: { type: string }
        desc: { type: string }
        type: { type: string }
        rect:
          $ref: "#/components/schemas/UiRect"
        clickable: { type: boolean }
        editable: { type: boolean }
        enabled: { type: boolean }
        children:
          type: array
          items:
            $ref: "#/components/schemas/UiNode"
    UiTree:
      type: object
      properties:
        mode: { type: integer }
        width: { type: integer }
        height: { type: integer }
        roots:
          type: array
          items:
            $ref: "#/components/schemas/UiNode"
    FileUpload:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: Relative path inside the project, e.g. __init__.py
        content:
          type: string
        encoding:
          type: string
          enum: [utf-8, base64]
          default: utf-8
        create:
          type: boolean
          default: false
          description: Create-only (single-file body); 409 if the path exists, 404 if the project is missing
    ProjectList:
      type: object
      properties:
        projects:
          type: array
          items:
            type: string
    Logs:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              ts: { type: integer }
              stream: { type: string }
              line: { type: string }
        next:
          type: integer
    EvalRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        timeout_ms:
          type: integer
          default: 8000
          minimum: 200
          maximum: 15000
    EvalResponse:
      type: object
      properties:
        ok: { type: boolean }
        result: { type: string }
        error: { type: string }
    Ok:
      type: object
      properties:
        ok: { type: boolean }
    Error:
      type: object
      properties:
        error: { type: string }
    Snapshot:
      type: object
      properties:
        id: { type: string }
        width: { type: integer }
        height: { type: integer }
        url: { type: string }
    Label:
      type: object
      required: [width, height, boxes]
      properties:
        width: { type: integer }
        height: { type: integer }
        boxes:
          type: array
          items:
            type: object
            properties:
              cls: { type: integer, description: Index into the dataset classes }
              rect: { type: array, items: { type: integer }, description: "[l, t, r, b] in pixels" }
